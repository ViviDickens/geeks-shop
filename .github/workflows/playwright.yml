name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Mondays at 09:00 UTC (06:00 Argentina)
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Playwright - ${{ matrix.browser }} (${{ matrix.suite }})
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        suite: [functional, visual]
        include:
          - suite: functional
            os: ubuntu-latest
          - suite: visual
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.browser }} ${{ runner.os == 'Linux' && '--with-deps' || '' }}

      - name: Build Next.js app
        run: npm run build
        env:
          CI: 'true'

      - name: Run functional tests
        if: matrix.suite == 'functional'
        run: npx playwright test --project=${{ matrix.browser }} --grep-invert 'Visual Regression Tests'
        env:
          CI: 'true'

      - name: Run visual tests against committed Windows baselines
        if: matrix.suite == 'visual'
        run: npx playwright test tests/visual --project=${{ matrix.browser }} --update-snapshots=none
        env:
          CI: 'true'

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Add run summary
        if: always()
        shell: bash
        run: |
          echo "## Playwright: ${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Execution status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "HTML, JSON and JUnit reports (when generated) are available as workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
